<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark navy background -->
  <rect width="32" height="32" rx="6" fill="#0A0F1E"/>
  <!-- Revenue recognition wave/chart line -->
  <polyline points="4,22 9,16 14,19 20,10 28,8" stroke="#4F8EF7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Upward recognition bar -->
  <rect x="5" y="20" width="4" height="7" rx="1" fill="#1E3A5F"/>
  <rect x="11" y="15" width="4" height="12" rx="1" fill="#254d7a"/>
  <rect x="17" y="11" width="4" height="16" rx="1" fill="#2a4a7f"/>
  <rect x="23" y="7" width="4" height="20" rx="1" fill="#4F8EF7" opacity="0.8"/>
  <!-- Green success dot at peak -->
  <circle cx="27" cy="8" r="2.5" fill="#34D399"/>
</svg>
